<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>练习进展观察台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span>教研数据 · 复核工作区</span><h1>练习进展观察台</h1><p>知识点掌握判断、下一份练习建议与历史预判检验</p></header>
<main><aside><h2>数据与范围</h2><label>数据版本<select id="revision"></select></label><div id="controls"></div>
<button id="inspect">查看作答描述</button>
<button id="mastery">查看掌握判断与建议</button>
<label>导入完整数据<input id="upload" type="file" accept=".json,application/json"></label>
<button id="raw">查看原始记录</button>
<h2>教学策略（本次查询，不回写源数据）</h2>
<label>截止日期（含当日）<input id="policy-as-of" type="date"></label>
<details><summary>先修条件</summary><div id="policy-prereq"></div>
<button id="add-prereq" type="button">新增先修关系</button></details>
<details><summary>可用题池（排除题目）</summary><div id="policy-pool"></div></details>
<button id="reset-policy" type="button">恢复数据集默认策略</button>
<h2>历史预判检验</h2>
<label>检验模式<select id="backtest-mode">
<option value="leave_one_student_out">整名学生留出（新学生视角）</option>
<option value="incremental_known_learners">已知学生的后续表现</option></select></label>
<button id="backtest">运行回测（严格按当时证据）</button>
<h2>分析记录</h2><label>记录名称<input id="title" value="本次复核"></label>
<button id="save">保存当前描述</button><div id="archive"></div>
<h2>已发布学习建议</h2><label>建议名称<input id="advice-title" value="给学生的练习建议"></label>
<button id="publish">发布当前建议（冻结快照）</button><div id="advice-archive"></div></aside>
<section><div id="status" role="status">正在读取本地数据…</div><div id="summary"></div>
<h2>知识点作答与尝试历史</h2><div id="notes"></div><canvas id="chart" width="960" height="300" aria-label="所选范围描述图"></canvas>
<div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
<h2>按知识点的掌握判断</h2><p id="model-meta" class="hint"></p>
<div class="table-wrap"><table><thead id="mastery-columns"></thead><tbody id="mastery-rows"></tbody></table></div>
<h2>下一份练习建议</h2><div id="recommendation"></div>
<h2>历史预判检验结果</h2><div id="backtest-panel"></div>
<h2 id="detail-heading">记录与依据</h2><pre id="details">点击记录行可查看详细字段。</pre><button id="export">导出当前记录</button>
</section></main><footer>仅使用本地虚构记录；后验概率、可信区间与回测指标是教学判断的辅助证据，不以单一总分替代教师决定。</footer><script src="/app.js"></script></body></html>
